[package]
name = "ip-country-data"
version = "0.1.0"
edition = "2024"
authors = ["Violet Hansen"]
license = "MIT"
repository = "https://github.com/HotCakeX/Official-IANA-IP-blocks"
documentation = "https://github.com/HotCakeX/Official-IANA-IP-blocks"
publish = false
rust-version = "1.99"

[dependencies]
serde = { version = "*", features = ["derive"] }
serde_json = "*"
csv = "*"
regex = "*"

[profile.release]
codegen-units = 1
opt-level = 3
split-debuginfo = "packed"
strip = "symbols"
lto = "fat"
incremental = false
panic = "unwind"
